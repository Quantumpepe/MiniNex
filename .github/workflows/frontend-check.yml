name: MiniNex Frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Test
        run: npm test
      - name: Build React/Capacitor UI
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mininex-backend.onrender.com
      - name: Save UI build for internal visual QA (no APK)
        uses: actions/upload-artifact@v4
        with:
          name: MiniNex-v0.6-webview-qa
          path: frontend/dist
          retention-days: 2
          if-no-files-found: error
