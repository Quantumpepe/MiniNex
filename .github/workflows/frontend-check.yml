name: MiniNex frontend checks

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'frontend/**'
      - '.github/workflows/frontend-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies (no private credentials)
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Validate production bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mininex-backend.onrender.com
          VITE_PRIVY_APP_ID: ${{ vars.MININEX_PRIVY_APP_ID }}
