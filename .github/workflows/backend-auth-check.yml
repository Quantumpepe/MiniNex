name: MiniNex backend auth checks

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-auth-check.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'requirements.txt'
      - '.github/workflows/backend-auth-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mininex_test
          POSTGRES_PASSWORD: ephemeral_ci_only
          POSTGRES_DB: mininex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mininex_test -d mininex_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest cryptography
      - run: python -m pytest backend/tests -q
        env:
          MININEX_TEST_POSTGRES_DSN: postgresql://mininex_test:ephemeral_ci_only@127.0.0.1:5432/mininex_test
