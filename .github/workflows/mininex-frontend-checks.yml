name: MiniNex frontend LIVE controls checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/mininex-frontend-checks.yml'
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/mininex-frontend-checks.yml'

permissions:
  contents: read

jobs:
  frontend-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run frontend safety unit tests
        run: npm test
      - name: Compile Android/iOS web bundle
        run: npm run build
