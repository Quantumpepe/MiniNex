name: MiniNex Android validation (manual only)

on:
  workflow_dispatch:
  # One-off test APK for the requested release candidate; main remains manual.
  push:
    branches: [apk-test-v0.8.9]

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout MiniNex
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install frontend and Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: Build bundled app (no static-site hosting)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mininex-backend.onrender.com
          VITE_PRIVY_APP_ID: ${{ vars.MININEX_PRIVY_APP_ID }}
      - name: Create native Android project
        run: npx cap add android
      - name: Sync bundled assets
        run: npx cap sync android
      - name: Build debug APK for installation and testing
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon assembleDebug
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniNex-Android-Privy-Test
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
