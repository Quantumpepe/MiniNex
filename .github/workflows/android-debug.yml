name: MiniNex Android validation (manual only)

on:
  workflow_dispatch:
  push:
    branches:
      - build/android-render-ota-20261110
    paths:
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout MiniNex
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install frontend and Capacitor dependencies
        run: npm install --no-audit --no-fund
      - name: Compute native compatibility fingerprint
        run: |
          echo "MININEX_NATIVE_ABI=$(node scripts/native-abi.mjs)" >> "$GITHUB_ENV"
          echo "MININEX_BUILD_AT=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Unit tests
        run: npm test
      - name: Build bundled app (no static-site hosting)
        run: npm run build
        env:
          VITE_API_BASE_URL: https://mininex-backend.onrender.com
          # Public app ID must match backend JWT audience and existing user wallets.
          VITE_PRIVY_APP_ID: cmw7sb7ty013o0gl55aqyzi3y
          VITE_MININEX_NATIVE_ABI: ${{ env.MININEX_NATIVE_ABI }}
          VITE_MININEX_BUILD_SHA: ${{ github.sha }}
          VITE_MININEX_BUILD_AT: ${{ env.MININEX_BUILD_AT }}
      - name: Create native Android project
        run: npx cap add android
      - name: Sync bundled assets
        run: npx cap sync android
      - name: Install full-bleed MiniNex adaptive launcher icon
        run: |
          python3 -m venv /tmp/mininex-icon-env
          /tmp/mininex-icon-env/bin/pip install --quiet Pillow
          /tmp/mininex-icon-env/bin/python - <<'PY'
          from pathlib import Path
          from base64 import b64decode
          from io import BytesIO
          from PIL import Image
          logo = Image.open(BytesIO(b64decode(Path('branding/mininex-logo.webp.b64').read_text().strip()))).convert('RGBA')
          width, height = logo.size
          # Crop the original wide background away: keep only the circular Nexus artwork.
          artwork = logo.crop((round(width * .145), round(height * .145), round(width * .855), round(height * .855)))
          resources = Path('android/app/src/main/res')
          for bucket, pixels in [('mdpi',48),('hdpi',72),('xhdpi',96),('xxhdpi',144),('xxxhdpi',192)]:
              folder = resources / ('mipmap-' + bucket)
              folder.mkdir(parents=True, exist_ok=True)
              legacy = artwork.resize((pixels,pixels),Image.Resampling.LANCZOS).convert('RGB')
              legacy.save(folder / 'ic_launcher.png')
              legacy.save(folder / 'ic_launcher_round.png')

              # Adaptive icons use a 108dp canvas, of which only the central 72dp
              # is guaranteed visible. Fill the entire mask with dark teal, and
              # put the MiniNex circle within the safe area at a legible scale.
              side = round(pixels * 108 / 48)
              foreground = Image.new('RGBA',(side,side),(0,0,0,0))
              diameter = round(side * .66)
              art = artwork.resize((diameter,diameter),Image.Resampling.LANCZOS)
              foreground.alpha_composite(art,((side-diameter)//2,(side-diameter)//2))
              foreground.save(folder / 'ic_launcher_foreground.png')

          adaptive = resources / 'mipmap-anydpi-v26'
          adaptive.mkdir(parents=True, exist_ok=True)
          drawable = resources / 'drawable'
          drawable.mkdir(parents=True, exist_ok=True)
          (drawable / 'mininex_icon_background.xml').write_text(
              '<?xml version="1.0" encoding="utf-8"?>\n'
              '<shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="rectangle">'
              '<solid android:color="#001B19"/></shape>\n')
          adaptive_xml = ('<?xml version="1.0" encoding="utf-8"?>\n'
              '<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">\n'
              '    <background android:drawable="@drawable/mininex_icon_background"/>\n'
              '    <foreground android:drawable="@mipmap/ic_launcher_foreground"/>\n'
              '</adaptive-icon>\n')
          for filename in ('ic_launcher.xml','ic_launcher_round.xml'):
              (adaptive / filename).write_text(adaptive_xml)
          print('Installed full-bleed dark MiniNex launcher icon with adaptive background (no white circle)')
          PY
      - name: Validate stable APK signing key
        env:
          MININEX_APK_KEYSTORE_B64: ${{ secrets.MININEX_APK_KEYSTORE_B64 }}
          MININEX_APK_KEYSTORE_PASSWORD: ${{ secrets.MININEX_APK_KEYSTORE_PASSWORD }}
          MININEX_APK_KEY_ALIAS: ${{ secrets.MININEX_APK_KEY_ALIAS }}
          MININEX_APK_KEY_PASSWORD: ${{ secrets.MININEX_APK_KEY_PASSWORD }}
        run: |
          if [ -z "$MININEX_APK_KEYSTORE_B64" ] || [ -z "$MININEX_APK_KEYSTORE_PASSWORD" ] || [ -z "$MININEX_APK_KEY_ALIAS" ] || [ -z "$MININEX_APK_KEY_PASSWORD" ]; then
            echo "::error::Stable APK signing secrets are required. See docs/ANDROID_TEST_SIGNING.md"
            exit 1
          fi
          printf '%s' "$MININEX_APK_KEYSTORE_B64" | base64 -d > android/mininex-test.jks
          chmod 600 android/mininex-test.jks
          keytool -list -keystore android/mininex-test.jks -storepass "$MININEX_APK_KEYSTORE_PASSWORD" -alias "$MININEX_APK_KEY_ALIAS" > /dev/null
      - name: Build signed debug APK for installation and future updates
        env:
          MININEX_APK_KEYSTORE_PASSWORD: ${{ secrets.MININEX_APK_KEYSTORE_PASSWORD }}
          MININEX_APK_KEY_ALIAS: ${{ secrets.MININEX_APK_KEY_ALIAS }}
          MININEX_APK_KEY_PASSWORD: ${{ secrets.MININEX_APK_KEY_PASSWORD }}
          MININEX_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          chmod +x android/gradlew
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          marker = 'android {'
          if marker not in s:
              raise SystemExit('Android Gradle config layout changed; cannot safely configure signing')
          signing = """
              signingConfigs {
                  mininexTest {
                      storeFile file('../mininex-test.jks')
                      storePassword System.getenv('MININEX_APK_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('MININEX_APK_KEY_ALIAS')
                      keyPassword System.getenv('MININEX_APK_KEY_PASSWORD')
                  }
              }
          """
          s = s.replace(marker, marker + '\n' + signing, 1)
          debug = 'buildTypes {'
          if debug not in s:
              raise SystemExit('Android build types missing')
          s = s.replace(debug, debug + "\n        debug { signingConfig signingConfigs.mininexTest }", 1)
          import re, os
          run = int(os.environ['MININEX_BUILD_NUMBER'])
          s,n = re.subn(r'versionCode\s+\d+', 'versionCode ' + str(10000 + run), s, count=1)
          if n != 1:
              raise SystemExit('Android versionCode not found')
          p.write_text(s)
          PY
          cd android
          ./gradlew --no-daemon assembleDebug
          keytool -list -v -keystore mininex-test.jks -storepass "$MININEX_APK_KEYSTORE_PASSWORD" -alias "$MININEX_APK_KEY_ALIAS" | grep 'SHA256:'
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniNex-Android-Privy-Test
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
